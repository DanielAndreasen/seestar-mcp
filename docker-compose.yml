# ADR-0002: Docker Compose runs ONLY the worker — never the MCP server.
# The MCP server runs on the host via `uv run` over stdio. The broker
# (Redis) is expected on the HOST at localhost:6379 (e.g. a system
# redis-server); the worker reaches it via host.docker.internal so both
# sides share ONE broker (REDIS_URL=redis://localhost:6379/0 on the host).
#
# The worker image is built from the PARENT directory of this repo so the
# build can COPY both sibling checkouts (ADR-0001 path dependency):
#   <parent>/seestar-controller/   and   <parent>/seestar-mcp/
# (clone the two repos side by side under their canonical names before
# running `docker compose up`).

services:
  worker:
    build:
      context: ..
      dockerfile: seestar-mcp/Dockerfile
    # Host networking: the broker is the host's redis-server bound to
    # 127.0.0.1:6379, unreachable via host.docker.internal from a
    # container. With host networking, localhost:6379 in the container
    # IS the host's redis — same instance the MCP server uses.
    network_mode: host
    environment:
      # Broker + result backend on the host — same instance the host-side
      # MCP server uses via REDIS_URL=redis://localhost:6379/0.
      REDIS_URL: redis://localhost:6379/0
      # Scope interop key, mounted read-only below (host path by default).
      SEESTAR_KEY_PATH: /run/seestar/key.pem
    volumes:
      - ${HOME}/.config/seestar-controller/key.pem:/run/seestar/key.pem:ro
      # Optional: prefork processes for the Compute queue (default: cpu count).
      # The Scope queue always runs at concurrency 1 (ADR-0004) — see
      # src/seestar_mcp/worker.py, which starts one worker per queue.
      # SEESTAR_MCP_WORKER_CONCURRENCY: "4"
    # Entrypoint: python -m seestar_mcp.worker — consumes BOTH queues with
    # two celery workers in this one service: `-Q scope --concurrency=1`
    # (exactly one consumer, ADR-0004) and `-Q compute` (parallel pool).
    command: [".venv/bin/python", "-m", "seestar_mcp.worker"]
